# Configuration file for the Income Prediction Model

model:
  name: "alpha_wealth_neural"
  type: "alpha_wealth"  # xgboost, lightgbm, catboost, alpha_wealth
  random_state: 42
  test_size: 0.2
  validation_size: 0.1

features:
  categorical: []
  numerical: []
  target: "income"

hyperparameters:
  xgboost:
    n_estimators: 1000
    max_depth: 8
    learning_rate: 0.01
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_alpha: 0.1
    reg_lambda: 1.0
    early_stopping_rounds: 50

paths:
  data_dir: "data"
  models_dir: "models"
  raw_data: "data/train.csv"
  test_data: "data/test.csv"
  hackathon_test_data: "data/hackathon_income_test.csv"  # Основной test файл для API

api:
  host: "0.0.0.0"
  port: 8000
  title: "Alfa-Bank Income Prediction API"
  version: "1.0.0"

frontend:
  port: 8501
  title: "Alfa-Bank Income Prediction Dashboard"

products:
  # Financial products with income thresholds and conditions
  credit_card:
    min_income: 30000
    max_rate: 25.9
    description: "Активное использование мобильного банка"
    product_name: "Премиальная дебетовая карта"
  
  consumer_credit:
    min_income: 50000
    max_rate: 15.9
    description: "Стабильный доход и низкая долговая нагрузка"
    product_name: "Потребительский кредит"
  
  auto_credit:
    min_income: 60000
    max_rate: 12.5
    description: "Стабильный доход и низкая долговая нагрузка"
    product_name: "Автокредит до 1.5 млн"
  
  mortgage:
    min_income: 80000
    max_rate: 8.5
    description: "Высокий стабильный доход"
    product_name: "Ипотечный кредит"
  
  investment_account:
    min_income: 100000
    description: "Высокий доход и потенциал для инвестиций"
    product_name: "Инвестиционный счет"
  
  premium_account:
    min_income: 200000
    description: "Премиум-клиент с высоким доходом"
    product_name: "Премиум-счет"

monitoring:
  enable: true
  metrics_log: "logs/metrics.json"

