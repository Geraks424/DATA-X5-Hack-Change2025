<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогноз дохода</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Прогноз дохода клиента</h1>
    <form id="income-form">
      <label>Возраст: <input type="number" name="age" required></label>
      <label>turn_cur_cr_avg_v2: <input type="number" name="turn_cur_cr_avg_v2" required></label>
      <label>mob_cnt_days: <input type="number" name="mob_cnt_days" required></label>
      <label>device_iphone_avg: <input type="number" name="device_iphone_avg" required></label>
      <label>vert_has_app_ru_tinkoff_investing: <input type="number" name="vert_has_app_ru_tinkoff_investing" required></label>
      <button type="submit">Прогнозировать доход</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
